<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi's Dandy Pixel Cats</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Press Start 2P', monospace;
            color: #2b2b2b;
            margin: 0;
            padding: 20px;
            image-rendering: pixelated;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        header {
            background: #ff69b4;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 25px;
            margin-bottom: 30px;
            color: #fff;
        }
        h1 {
            font-size: 1.1rem;
            text-shadow: 3px 3px 0px #000;
            margin: 0 0 10px 0;
            line-height: 1.5;
        }
        p {
            font-size: 0.6rem;
            color: #fff5f8;
            margin: 0;
        }
        .upload-box {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            padding: 25px;
            margin-bottom: 40px;
            display: inline-block;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: #ff1493;
            color: #fff;
            border: 3px solid #000;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            display: inline-block;
            transition: transform 0.1s;
        }
        .upload-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }
        .cat-card {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 5px 5px 0px #000;
            padding: 12px;
            transition: transform 0.2s;
        }
        .cat-card:hover {
            transform: translateY(-4px);
        }
        .cat-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 2px solid #000;
            display: block;
            margin-bottom: 10px;
        }
        .cat-label {
            font-size: 0.5rem;
            color: #ff1493;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐱 Lumi's Dandy Cats 🐱</h1>
            <p>Pixelový salón pro ty nejstylovější kočičí tváře</p>
        </header>

        <div class="upload-box">
            <p style="color: #2b2b2b; font-size: 0.65rem; margin-bottom: 15px;">Přidej novou kočičí hvězdu:</p>
            <label class="upload-btn">
                ✨ Vybrat fotku kočky
                <input type="file" id="catInput" accept="image/*" multiple>
            </label>
        </div>

        <div class="gallery" id="catGallery"></div>
    </div>

    <script>
        const catInput = document.getElementById('catInput');
        const catGallery = document.getElementById('catGallery');

        catInput.addEventListener('change', function(e) {
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const card = document.createElement('div');
                        card.className = 'cat-card';
                        card.innerHTML = `
                            <img src="${event.target.result}" alt="Kočička">
                            <div class="cat-label">★ Dandy Star ★</div>
                        `;
                        catGallery.appendChild(card);
                    }
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>

</body>
</html>
